---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

# Pull requests are tested and built; pushes to master also publish
# ghcr.io/bbck/gw2tools:rolling (and :sha-<commit>). The homelab pins
# rolling@sha256:..., and Renovate opens a digest update when rolling moves.
# The build is reproducible, so a push that doesn't change the image (docs,
# CI, Renovate config) gives the same digest and rolling doesn't move.
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test

  image:
    name: Image
    needs:
      - test
    runs-on: ubuntu-26.04
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/gw2tools
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The digest rolling points to before this push. A missing tag hashes the
      # empty output, which matches no real digest.
      - name: Current Digest
        id: current
        if: ${{ env.PUBLISH == 'true' }}
        run: echo "digest=sha256:$(docker buildx imagetools inspect --raw "${IMAGE}:rolling" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Reproducible: a fixed SOURCE_DATE_EPOCH and rewritten file timestamps,
      # no per-commit labels or annotations (the static labels are in the
      # Dockerfile), and no buildx provenance, which records build times and
      # would change the index digest. The Attestation step provides provenance
      # instead, stored beside the image rather than in it.
      - name: Build and Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          outputs: type=image,push=${{ env.PUBLISH }},rewrite-timestamp=true
          tags: |
            ${{ env.IMAGE }}:rolling
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      # Only attest a new digest; one that's already published has its
      # attestation from the commit that first built it.
      - name: Attestation
        if: ${{ env.PUBLISH == 'true' && steps.build.outputs.digest != steps.current.outputs.digest }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Summary
        if: ${{ env.PUBLISH == 'true' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          UNCHANGED: ${{ steps.build.outputs.digest == steps.current.outputs.digest }}
        run: |
          echo "${IMAGE}:rolling@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$UNCHANGED" == true ]]; then
            echo "Unchanged: rolling already pointed to this digest." >> "$GITHUB_STEP_SUMMARY"
          fi
